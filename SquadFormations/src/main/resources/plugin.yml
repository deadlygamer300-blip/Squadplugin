name: SquadFormations
version: '1.0.0'
main: com.squadcore.npc.SquadPlugin
api-version: '1.21'
author: SquadCore
description: Packet-based fake player squads, disciplined formations and ambient population NPCs.
depend: [ProtocolLib]

commands:
  squad:
    description: Control squad formations and ambient population NPCs.
    usage: /squad <spawn|formation|follow|ambient|clear>
    permission: squad.admin

permissions:
  squad.admin:
    description: Allows full control over the SquadFormations plugin.
    default: op
